<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://*.githubusercontent.com https://i.ytimg.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://api.github.com https://github.com https://raw.githubusercontent.com https://*.workers.dev http://localhost:8787; object-src 'none'; base-uri 'self';" />
    <title>Prompt Library</title>
    <meta name="description" content="A curated library of AI prompts stored as GitHub Issues" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Theme bootstrap (avoids dark-mode flash)
      (function () {
        try {
          const theme = localStorage.getItem('pl_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.setAttribute(
            'data-color-mode',
            (theme === 'dark' || (!theme && prefersDark)) ? 'dark' : 'light',
          );
        } catch (e) {}
      })();

      // OAuth callback bootstrap: GitHub returns ?code=&state= at the site root
      // because OAuth App callback URLs cannot include a hash fragment. Rewrite
      // to the HashRouter route before React boots.
      (function () {
        try {
          const search = window.location.search;
          if (!search) return;
          const params = new URLSearchParams(search);
          const hasCode = params.has('code') && params.has('state');
          const hasError = params.has('error');
          if (!hasCode && !hasError) return;
          const newHash = '#/auth/callback' + search;
          const newUrl = window.location.pathname + newHash;
          window.history.replaceState(null, '', newUrl);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
